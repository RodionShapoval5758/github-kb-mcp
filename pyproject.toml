[project]
name = "kb-mcp"
version = "0.1.0"
description = "Read-only MCP server over a GitHub-hosted project knowledge base"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["ruff>=0.16"]

[tool.ruff]
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_mcp"]
